name: Build luci-theme-4lpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'Makefile'
      - 'css/**'
      - 'html/**'
      - 'js/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: luci-theme-4lpha

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libncurses5-dev libssl-dev python3 \
            python3-distutils unzip wget zlib1g-dev

      - name: Download OpenWrt SDK (x86_64, OpenWrt 23.05.2)
        run: |
          wget https://downloads.openwrt.org/releases/23.05.2/targets/x86/64/openwrt-sdk-23.05.2-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-*.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*")
          mv "$SDK_DIR" openwrt-sdk

      - name: Copy luci-theme-4lpha
        run: |
          mkdir -p openwrt-sdk/package/custom
          cp -r luci-theme-4lpha openwrt-sdk/package/custom/

      - name: Build luci-theme-4lpha
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/custom/luci-theme-4lpha/compile V=s

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-4lpha-ipk
          path: openwrt-sdk/bin/packages/**/*.ipk
